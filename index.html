<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>rlogis</title>
    <script>
      window.addEventListener("error", (e) =>
        console.error("WINERR", e.message, e.filename, e.lineno, e.colno),
      );
      window.addEventListener("unhandledrejection", (e) =>
        console.error("REJECT", e.reason && (e.reason.stack || e.reason.message || e.reason)),
      );
    </script>
    <link data-trunk rel="rust" data-wasm-opt="z" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #15171c;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }

      noscript {
        color: #e7e9ee;
        font-family: system-ui, sans-serif;
        display: block;
        padding: 2rem;
      }
    </style>
  </head>
  <body>
    <canvas id="rlogis_canvas"></canvas>
    <noscript>rlogis needs JavaScript and WebGL to run.</noscript>
  </body>
</html>
