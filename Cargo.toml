[package]
name = "rlogis"
version = "0.1.0"
edition = "2024"
description = "Log viewer for Space Station 13 game logs"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "persistence",
    "system_fonts",
    "wayland",
    "x11",
] }
egui = "0.37.0"
egui_extras = "0.37.0"

# Native: system file dialog on a worker thread.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.15"

# Web: eframe's WebRunner plus a tiny file-input based picker.
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Blob",
    "Document",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "FileReader",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "Window",
] }

[profile.release]
opt-level = 2
lto = "thin"

# Compile dependencies with optimizations even in debug builds, so large logs
# and the egui renderer stay responsive during development.
[profile.dev.package."*"]
opt-level = 2
